    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    :root {
      color-scheme: dark;

      --text:#f6eef2; --text2:#b9a9b2; --text3:#7f7179;
      --radius:8px;
      --acc:#ff6fae; --acc-bg:rgba(255,111,174,.14); --acc-bo:rgba(255,111,174,.5);

    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .span2 { grid-column:span 2; }
    .list { display:flex; flex-direction:column; gap:8px; }
    .list-item { background:var(--card); border:0.5px solid var(--border); border-radius:12px; padding:13px 15px; display:flex; align-items:center; gap:14px; }
    .empty { text-align:center; padding:56px 0; color:var(--text3); }
    .sec-title { font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:1px; color:var(--text2); margin-bottom:14px; }
    .err-box { background:var(--err-bg); border:0.5px solid var(--err-bo); border-radius:var(--radius); padding:12px 14px; font-size:13px; color:var(--err); margin-bottom:14px; }

    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .li-total { text-align:right; min-width:108px; }
    .btn-status { min-width:98px; justify-content:center; }
    .help-step { display:flex; gap:14px; align-items:flex-start; }
    .help-num { flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--acc-bg); color:var(--acc); border:0.5px solid var(--acc-bo); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
    .help-p { font-size:13.5px; color:var(--text2); line-height:1.65; margin-bottom:10px; }
    .help-p strong { color:var(--text); }
    .mock { background:var(--bg); border:1px dashed var(--border-s); border-radius:10px; padding:14px; margin:4px 0 12px; pointer-events:none; user-select:none; }
    .mock-cap { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--text3); margin-bottom:10px; font-weight:600; font-family:var(--mono); }
    @media (max-width: 640px) {
      .main { padding:18px 14px; }
      .header { flex-wrap:wrap; gap:10px; padding:12px 16px; }

      .stats-grid { grid-template-columns:1fr 1fr; gap:8px; }
      .list-item { flex-direction:column; align-items:stretch; gap:10px; }
      .li-total { text-align:left; min-width:0; }
      .btn-status { min-width:0; }
      .li-actions { flex-wrap:wrap; }

    .header { background:rgba(20,20,27,.92); backdrop-filter:blur(8px); }
    .list-item { transition:border-color .15s; }
    .list-item:hover { border-color:rgba(255,111,174,.35); }
  </style>
</head>

// ── UTILS ─────────────────────────────────────────────────────────────────────
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function todayLong(){ return new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function genInv(sessions){
  var d=new Date();
  var prefix='BA-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+String(d.getFullYear()).slice(-2)+'-';
  var max=0;
  (sessions||[]).forEach(function(s){
    if(s.invoiceNumber&&s.invoiceNumber.indexOf(prefix)===0){
      var num=parseInt(s.invoiceNumber.slice(prefix.length),10);
      if(!isNaN(num)&&num>max)max=num;
    }
  });
  return prefix+(max+1);
}
function calcTotal(s){ return (s.lineItems||[]).reduce(function(t,i){return t+(parseFloat(i.qty)||0)*(parseFloat(i.rate)||0);},0); }
function fmtDate(d){ if(!d)return'—'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// ── DATA MAPPERS ──────────────────────────────────────────────────────────────
function dbToSession(db){
  return { id:db.id, clientName:db.client_name||'', clientEmail:db.client_email||'',
    songs:db.songs||'', dates:db.dates||'', notes:db.notes||'',
    lineItems:db.line_items||[], status:db.status||'draft',
    invoiceNumber:db.invoice_number||'', createdAt:db.created_at, exportedAt:db.exported_at||null };
}
function sessionToDb(s,userId){
  return { user_id:userId, client_name:s.clientName||'', client_email:s.clientEmail||'',
    songs:s.songs||'', dates:s.dates||'', notes:s.notes||'',
    line_items:s.lineItems||[], status:s.status||'draft',
    invoice_number:s.invoiceNumber||'', updated_at:new Date().toISOString() };
}
function dbToSettings(db){
  if(!db) return DEFAULT_SETTINGS;
  return { email:db.email||'', phone:db.phone||'', wfhUrl:db.wfh_url||'',
    paypal:{handle:db.paypal_handle||'',link:db.paypal_link||''},
    venmo:{handle:db.venmo_handle||''}, zelle:{contact:db.zelle_contact||''},
    wise:{link:db.wise_link||''},
    rates:Array.isArray(db.rates)&&db.rates.length?db.rates:DEFAULT_SETTINGS.rates };
}
function settingsToDb(s,userId){
  return { user_id:userId, email:s.email||'', phone:s.phone||'', wfh_url:s.wfhUrl||'',
    paypal_handle:s.paypal&&s.paypal.handle?s.paypal.handle:'',
    paypal_link:s.paypal&&s.paypal.link?s.paypal.link:'',
    venmo_handle:s.venmo&&s.venmo.handle?s.venmo.handle:'',
    zelle_contact:s.zelle&&s.zelle.contact?s.zelle.contact:'',
    wise_link:s.wise&&s.wise.link?s.wise.link:'',
    rates:s.rates||[], updated_at:new Date().toISOString() };
}

// ── SUPABASE OPS ──────────────────────────────────────────────────────────────
async function fetchSessions(){
  var r=await sb.schema('session_log').from('ba_sessions').select('*').order('created_at',{ascending:false});
  if(r.error) throw r.error;
  return (r.data||[]).map(dbToSession);
}
async function insertSession(s,userId){
  var r=await sb.schema('session_log').from('ba_sessions').insert(sessionToDb(s,userId));
  if(r.error) throw r.error;
}
async function updateSession(s,userId){
  var r=await sb.schema('session_log').from('ba_sessions').update(sessionToDb(s,userId)).eq('id',s.id);
  if(r.error) throw r.error;
}
async function removeSession(id){
  var r=await sb.schema('session_log').from('ba_sessions').delete().eq('id',id);
  if(r.error) throw r.error;
}
async function patchStatus(id,status){
  var r=await sb.schema('session_log').from('ba_sessions').update({status:status,updated_at:new Date().toISOString()}).eq('id',id);
  if(r.error) throw r.error;
}
async function markExported(ids,ts){
  var r=await sb.schema('session_log').from('ba_sessions').update({exported_at:ts}).in('id',ids);
  if(r.error) throw r.error;
}
async function clearExported(id){
  var r=await sb.schema('session_log').from('ba_sessions').update({exported_at:null}).eq('id',id);
  if(r.error) throw r.error;
}
async function fetchSettings(userId){
  var r=await sb.schema('session_log').from('ba_settings').select('*').eq('user_id',userId).maybeSingle();
  if(r.error) throw r.error;
  return dbToSettings(r.data);
}
async function saveSettings(s,userId){
  var r=await sb.schema('session_log').from('ba_settings').upsert(settingsToDb(s,userId),{onConflict:'user_id'});
  if(r.error) throw r.error;
}

// ── QUICKBOOKS CSV EXPORT ─────────────────────────────────────────────────────
function csvCell(v){
  var t=String(v==null?'':v);
  return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
}
function csvDate(d){
  var x=d?new Date(d):new Date();
  return String(x.getMonth()+1).padStart(2,'0')+'/'+String(x.getDate()).padStart(2,'0')+'/'+x.getFullYear();
}
function downloadInvoicesCsv(list){
  var cols=['InvoiceNo','Customer','CustomerEmail','InvoiceDate','DueDate','ItemDescription','Qty','Rate','Amount','Memo'];
  var rows=[cols.join(',')];
  list.forEach(function(sess){
    var date=csvDate(sess.createdAt);
    var memo=[sess.songs,sess.dates].filter(Boolean).join(' · ');
    (sess.lineItems||[]).forEach(function(i){
      var qty=parseFloat(i.qty)||0, rate=parseFloat(i.rate)||0;
      rows.push([sess.invoiceNumber,sess.clientName,sess.clientEmail,date,date,i.name,qty,rate.toFixed(2),(qty*rate).toFixed(2),memo].map(csvCell).join(','));
    });
  });
  var blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='invoices-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

// ── ROOT APP ──────────────────────────────────────────────────────────────────
function App(){
  var _a=useState('loading'),authState=_a[0],setAuthState=_a[1];
  var _u=useState(null),user=_u[0],setUser=_u[1];
  var _pg=useState('sessions'),page=_pg[0],setPage=_pg[1];
  var _v=useState('list'),view=_v[0],setView=_v[1];
  var _c=useState(null),current=_c[0],setCurrent=_c[1];
  var _df=useState(null),duplicateFrom=_df[0],setDuplicateFrom=_df[1];
  var _ss=useState([]),sessions=_ss[0],setSessions=_ss[1];
  var _st=useState(DEFAULT_SETTINGS),settings=_st[0],setSettings=_st[1];
  var _dl=useState(false),dataLoading=_dl[0],setDataLoading=_dl[1];
  var _ae=useState(''),appError=_ae[0],setAppError=_ae[1];

  useEffect(function(){
    sb.auth.getSession().then(function(r){
      if(r.data&&r.data.session&&r.data.session.user){setUser(r.data.session.user);setAuthState('authenticated');}
      else setAuthState('unauthenticated');
    });
    var sub=sb.auth.onAuthStateChange(function(_,session){
      if(session&&session.user){setUser(session.user);setAuthState('authenticated');}
      else{setUser(null);setAuthState('unauthenticated');setSessions([]);setSettings(DEFAULT_SETTINGS);}
    });
    return function(){if(sub&&sub.data&&sub.data.subscription)sub.data.subscription.unsubscribe();};
  },[]);

  useEffect(function(){
    if(authState!=='authenticated'||!user)return;
    setDataLoading(true);
    sb.rpc('join_app',{p_app:'session_log'}).then(function(r){
      if(r.error) throw r.error;
      return Promise.all([fetchSessions(),fetchSettings(user.id)]);
    }).then(function(results){
      setSessions(results[0]);setSettings(results[1]);
    }).catch(function(err){setAppError(err.message);}).finally(function(){setDataLoading(false);});
  },[authState,user&&user.id]);

  function goList(){setView('list');setCurrent(null);setDuplicateFrom(null);}

  function handleDuplicateSession(s){setCurrent(null);setDuplicateFrom(s);setView('form');}

  function handleSaveSession(form,opts){
    opts=opts||{};
    var invNum=form.invoiceNumber||genInv(sessions);
    var sessionData=Object.assign({},form,{invoiceNumber:invNum});
    var op=current?updateSession(Object.assign({},current,sessionData),user.id):insertSession(sessionData,user.id);
    op.then(function(){return fetchSessions();}).then(function(updated){
      setSessions(updated);
      if(opts.sendAfter){
        var saved=updated.filter(function(s){return s.invoiceNumber===invNum;})[0]||sessionData;
        openMailto(saved,settings);
        setCurrent(saved);setDuplicateFrom(null);setView('invoice');
      } else {
        goList();
      }
    }).catch(function(err){setAppError(err.message);});
  }
  function handleDeleteSession(id){
    removeSession(id).then(function(){setSessions(function(s){return s.filter(function(x){return x.id!==id;});});}).catch(function(err){setAppError(err.message);});
  }
  function handleStatusChange(id,status){
    patchStatus(id,status).then(function(){
      setSessions(function(s){return s.map(function(x){return x.id===id?Object.assign({},x,{status:status}):x;});});
      setCurrent(function(c){return c&&c.id===id?Object.assign({},c,{status:status}):c;});
    }).catch(function(err){setAppError(err.message);});
  }
  function handleExport(all){
    var list=sessions.filter(function(x){return x.status!=='draft'&&(all||!x.exportedAt);});
    if(!list.length){setAppError('Nothing to export.');return;}
    downloadInvoicesCsv(list);
    setTimeout(function(){
      var todo=list.filter(function(x){return !x.exportedAt;});
      var msg=todo.length
        ?'Mark '+todo.length+' session'+(todo.length===1?'':'s')+' as exported?\n\nOK = mark exported\nCancel = leave unmarked (use this if the import failed)'
        :null;
      if(msg&&confirm(msg)){
        var ts=new Date().toISOString();
        var ids=todo.map(function(x){return x.id;});
        markExported(ids,ts).then(function(){
          setSessions(function(cur){return cur.map(function(x){return ids.indexOf(x.id)>-1?Object.assign({},x,{exportedAt:ts}):x;});});
        }).catch(function(err){setAppError(err.message);});
      }
    },400);
  }
  function handleClearExport(id){
    clearExported(id).then(function(){
      setSessions(function(cur){return cur.map(function(x){return x.id===id?Object.assign({},x,{exportedAt:null}):x;});});
    }).catch(function(err){setAppError(err.message);});
  }
  function handleSaveSettings(s){
    saveSettings(s,user.id).then(function(){setSettings(s);}).catch(function(err){setAppError(err.message);});
  }

  if(authState==='loading'||dataLoading){
    return h('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:14}},dataLoading?'Loading studio data...':'Loading...');
  }
  if(authState==='unauthenticated') return h(LoginScreen,null);

  var TABS=[{id:'sessions',label:'Sessions'},{id:'settings',label:'Settings'},{id:'help',label:'? Help'}];
  return h('div',null,
    appError&&h('div',{style:{background:'var(--err-bg)',borderBottom:'0.5px solid var(--err-bo)',padding:'10px 20px',fontSize:13,color:'var(--err)',display:'flex',alignItems:'center',justifyContent:'space-between'}},
      'Error: '+appError,
      h('button',{onClick:function(){setAppError('');},style:{background:'none',border:'none',color:'var(--err)',cursor:'pointer',fontSize:16}},'✕')
    ),
    h('div',{className:'header'},
      h('div',{onClick:function(){setPage('sessions');goList();},style:{cursor:'pointer'}},
        h('div',{className:'brand',style:{fontSize:26,lineHeight:1}},'InVoice'),
        h('div',{style:{fontSize:10,textTransform:'uppercase',letterSpacing:2,color:'var(--text3)',marginTop:1}},'Session management')
      ),
      h('div',{style:{display:'flex',gap:4}},
        TABS.map(function(t){
          return h('button',{key:t.id,onClick:function(){setPage(t.id);goList();window.scrollTo(0,0);},style:{padding:'6px 13px',fontSize:12,fontWeight:500,borderRadius:'var(--radius)',cursor:'pointer',border:'0.5px solid',background:page===t.id?'var(--acc-bg)':'transparent',color:page===t.id?'var(--acc)':'var(--text2)',borderColor:page===t.id?'var(--acc-bo)':'transparent'}},t.label);
        })
      )
    ),
    h('div',{className:'main'},
      page==='sessions'&&view==='list'&&h(SessionsView,{sessions:sessions,onNew:function(){setCurrent(null);setDuplicateFrom(null);setView('form');},onEdit:function(s){setCurrent(s);setDuplicateFrom(null);setView('form');},onView:function(s){setCurrent(s);setView('invoice');},onDelete:handleDeleteSession,onStatus:handleStatusChange,onDuplicate:handleDuplicateSession,onExport:handleExport,onClearExport:handleClearExport}),
      page==='sessions'&&view==='form'&&h(SessionForm,{session:current,settings:settings,nextInvoice:genInv(sessions),duplicateFrom:duplicateFrom,onCancel:goList,onSave:handleSaveSession,onStatus:handleStatusChange}),
      page==='sessions'&&view==='invoice'&&current&&h(InvoiceView,{session:current,settings:settings,onBack:goList,onEdit:function(){setView('form');},onPrintInvoice:function(){openPrintInvoice(current,settings);},onPrintWFH:function(){openPrintWFH(current);},onEmail:function(){openMailto(current,settings);},onStatus:handleStatusChange}),
      page==='help'&&h(HelpView,{onBack:function(){setPage('sessions');goList();}}),
      page==='settings'&&h(SettingsView,{settings:settings,onSave:handleSaveSettings,userEmail:user.email,onLogout:function(){sb.auth.signOut();}})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
